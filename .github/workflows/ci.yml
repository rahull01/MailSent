# MailSent — CI foundation (ENG-001) — hardened
# Secrets + repository health guard, backend build/test/coverage (Maven),
# frontend lint/build (Next.js), with dependency caching and artifact upload.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  foundation-guard:
    name: Secrets & repository health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run secrets guard
        run: bash scripts/guard-secrets.sh
      - name: Run repository health check
        run: bash scripts/repo-health.sh

  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: 'maven'
      - name: Build, test, coverage
        working-directory: backend
        run: mvn -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/site/jacoco
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/index.html

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        working-directory: frontend
        run: npm install
      - name: Formatting check (Prettier)
        working-directory: frontend
        run: npx prettier --check "src/**/*.ts" "src/**/*.tsx" "app/**/*.ts" "app/**/*.tsx"
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build