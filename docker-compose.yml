# MailSent — Engineering Foundation (Docker Compose)
# PostgreSQL + Redis are the approved storage; backend and frontend the runtimes.
# Normal named network + internal network isolate the data plane.

networks:
  mailsent:
    driver: bridge
  mailsent-internal:
    driver: bridge
    internal: true

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

services:
  postgres:
    image: postgres:16-alpine
    container_name: mailsent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mailsent}
      POSTGRES_USER: ${POSTGRES_USER:-mailsent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mailsent-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mailsent}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: mailsent-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - mailsent-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: mailsent-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mailsent}
      POSTGRES_USER: ${POSTGRES_USER:-mailsent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"
    networks:
      - mailsent
      - mailsent-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build: ./frontend
    container_name: mailsent-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    networks:
      - mailsent