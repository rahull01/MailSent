# MailSent backend — Engineering Foundation configuration.
# Values come from environment (docker-compose / CI); none are secrets.

spring:
  application:
    name: mailsent-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/mailsent}
    username: ${POSTGRES_USER:mailsent}
    password: ${POSTGRES_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.format_sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  task:
    scheduling:
      pool:
        size: 1

mailsent:
  observation:
    reobserve:
      interval: 86400000
  ingest:
    dmarc:
      rate-limit:
        per-ip-per-minute: 60
        per-uuid-per-minute: 20
        per-uuid-per-hour: 40
        per-ip-per-hour: 120

server:
  port: ${BACKEND_PORT:8080}
  tomcat:
    max-http-form-post-size: 5MB
    max-swallow-size: 2MB

# Observability: health/info only on the management port. Prometheus is prod-only
# on that same internal port (see application-prod.yml). Details are never public.
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Logging foundation (structured, correlation id via MDC 'requestId')
logging:
  level:
    root: INFO
    com.mailsent: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{requestId:-}] %logger{36} - %msg%n"