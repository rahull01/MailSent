# MailSent backend — Engineering Foundation configuration.
# Values come from environment (docker-compose / CI); none are secrets.

spring:
  application:
    name: mailsent-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/mailsent}
    username: ${POSTGRES_USER:mailsent}
    password: ${POSTGRES_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.format_sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${BACKEND_PORT:8080}

# Observability foundation
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# Logging foundation (structured, correlation id via MDC 'requestId')
logging:
  level:
    root: INFO
    com.mailsent: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{requestId:-}] %logger{36} - %msg%n"