# Test profile for the Engineering Foundation.
# Excludes persistence/cache autoconfig so the context loads without a
# running database or redis — the baseline test foundation is hermetic.
spring:
  task:
    scheduling:
      enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

management:
  server:
    port: -1
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never