# Test profile for the Engineering Foundation.
# Excludes persistence/cache autoconfig so the context loads without a
# running database or redis — the baseline test foundation is hermetic.
spring:
  task:
    scheduling:
      enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

management:
  server:
    port: -1
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never